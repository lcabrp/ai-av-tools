[project]
name = "av-tools"
version = "0.1.0"
description = "Extract insights from audio/video files using local or cloud AI models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "anthropic>=0.40.0",
    "google-genai>=0.1.1",
    "torch",
    "torchaudio",
    "faster-whisper>=1.2.1",
    "youtube-transcript-api>=0.6.3",
    "yt-dlp>=2024.8.6",
    "mutagen>=1.47.0",
    "ruff>=0.17.2",
]


[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

